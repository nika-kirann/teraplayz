<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin · TeraPlayz</title>
  <meta name="theme-color" content="#7c3aed" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("tp_theme");
        if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body class="admin">
  <header class="topbar">
    <div class="container topbar-inner">
      <a href="/" class="brand" aria-label="TeraPlayz site">
        <img src="/assets/favicon.svg" alt="" class="brand-icon" width="36" height="36" />
        <span class="brand-word">Tera<span>Playz</span></span><span class="admin-pill">Admin</span>
      </a>
      <nav class="nav" aria-label="Admin" id="adminNav" hidden>
        <a href="#dashboard" data-tab="dashboard">Dashboard</a>
        <a href="#upload" data-tab="upload">Upload</a>
        <a href="#videos" data-tab="videos">Videos</a>
      </nav>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
          <svg class="i-moon" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="i-sun" viewBox="0 0 24 24" width="20" height="20"><circle cx="12" cy="12" r="5" fill="currentColor"/><g stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></g></svg>
        </button>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" hidden>Log out</button>
      </div>
    </div>
  </header>

  <main id="app" class="container admin-main"></main>

  <nav class="bottom-nav admin-bottom" id="adminBottom" aria-label="Admin" hidden>
    <a href="#dashboard" data-tab="dashboard"><span>📊</span>Dashboard</a>
    <a href="#upload" data-tab="upload"><span>⬆️</span>Upload</a>
    <a href="#videos" data-tab="videos"><span>🎬</span>Videos</a>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/admin/admin.js"></script>
</body>
</html>
