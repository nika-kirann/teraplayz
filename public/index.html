<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>teraplayz</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white min-h-screen">
  <header class="flex items-center justify-between p-4 border-b border-zinc-800">
    <h1 class="text-2xl font-bold tracking-tight">teraplayz</h1>
    <div class="flex gap-4 items-center">
      <div id="loginContainer"></div>
      <button id="premiumBtn" class="bg-gradient-to-r from-pink-500 to-purple-600 px-4 py-2 rounded-full text-sm font-medium hover:opacity-90">Go Premium · 100★</button>
      <a href="https://t.me/your_channel" target="_blank" class="text-sm text-zinc-400 hover:text-white">Join Channel</a>
    </div>
  </header>

  <main class="p-4 max-w-7xl mx-auto">
    <div id="ads" class="mb-6 bg-zinc-900 border border-zinc-700 rounded-lg p-4 text-center text-zinc-400 text-sm">
      Ad space · upgrade to remove
    </div>

    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
      <!-- videos injected -->
    </div>
  </main>

  <!-- Player modal -->
  <div id="modal" class="hidden fixed inset-0 bg-black/90 flex items-center justify-center z-50">
    <div class="relative w-full max-w-4xl mx-4">
      <button id="closeModal" class="absolute -top-10 right-0 text-white text-2xl">&times;</button>
      <video id="player" controls class="w-full rounded-lg" playsinline></video>
      <h2 id="playerTitle" class="mt-4 text-xl font-medium"></h2>
    </div>
  </div>

  <script>
    // Telegram Login Widget callback
    function onTelegramAuth(user) {
      window.telegramLogin(user);
    }
  </script>
  <script async src="https://telegram.org/js/telegram-widget.js?22"
          data-telegram-login="YOUR_BOT_USERNAME"
          data-size="medium"
          data-onauth="onTelegramAuth(user)"
          data-request-access="write"></script>
  <script src="script.js"></script>
</body>
</html>
